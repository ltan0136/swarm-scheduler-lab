name: offline-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Run offline end-to-end smoke
        run: swarm-scheduler-lab smoke --output results/ci-smoke
      - name: Save smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-smoke-results
          path: results/ci-smoke/
          if-no-files-found: ignore
